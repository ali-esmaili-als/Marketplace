name: Marketplace CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Test_password_123!"
        ports:
          - 1433:1433
    env:
      MARKETPLACE_SQLSERVER: "Server=localhost,1433;Database=MarketplaceIntegrationTests;User ID=sa;Password=Test_password_123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Marketplace.sln

      - name: Build
        run: dotnet build Marketplace.sln --configuration Release --no-restore

      - name: Test domain and application
        run: dotnet test tests/Marketplace.Domain.Tests/Marketplace.Domain.Tests.csproj --configuration Release --no-build

      - name: Test SQL Server constraints against a real SQL Server instance
        run: dotnet test tests/Marketplace.SqlServer.IntegrationTests/Marketplace.SqlServer.IntegrationTests.csproj --configuration Release --no-build
